  .board[data-letter="B"] header { border-left: 4px solid var(--b-color); }
  .board[data-letter="C"] header { border-left: 4px solid var(--c-color); }

    width: 24px; height: 24px;
    background: var(--fg); color: var(--bg);
    text-align: center; line-height: 24px;
    font-weight: 700;
    margin-right: 8px;

    background: #0c0c0c;

  .beat-head .btime { color: var(--fg); }
  .beat-head .bdur { color: var(--dim); margin-left: auto; }

  .thumb {

    flex-shrink: 0;
    background: #1f2937;
    position: relative;
    overflow: hidden;

    width: 100%; height: 100%;

    display: block;
  }

    position: absolute;
    top: 2px; left: 2px;
    background: rgba(0,0,0,0.7);
    color: var(--fg);
    padding: 1px 4px;
    font-size: 10px;
    font-weight: 600;

    text-align: center;

  .beat-content .purpose {

  .track {

    height: 48px;
    background: #0a0a0a;
    border: 1px solid var(--line);
  }
  .block {
    position: absolute;
    top: 2px; bottom: 2px;
    background: rgba(255, 140, 66, 0.15);
    border-left: 2px solid var(--accent);
    padding: 2px 4px;
    font-size: 9px;
    color: var(--fg);

  .ref {

// renderers
function letterStyle(L) {
  return { A: 'background:#ff8c42', B: 'background:#fef34c', C: 'background:#818cf8' }[L] || '';
}

function renderBoards() {
  const grid = document.getElementById('boards-grid');
  ['A','B','C'].forEach(L => {
    const sb = STORYBOARDS[L];
    const board = document.createElement('div');
    board.className = 'board';
    board.dataset.letter = L;
    board.innerHTML = `
      <header>
        <span class="letter">${L}</span>
        <h2>${sb.name}</h2>
        <div class="meta">${sb.shape}</div>
        <div class="meta">${sb.beatCount} beats · ${sb.assetCount} assets · variants: ${sb.refs}</div>
      </header>
      <div class="beats">${sb.beats.map(beatHTML).join('')}</div>
    `;
    grid.appendChild(board);
  });
}

function beatHTML(b) {
  const a = ASSETS[b.asset];
  let thumb;
  if (b.asset === 'TYPO' || !a.src) {
    thumb = `<div class="thumb typographic">TYPO<br>only</div>`;
  } else if (a.type === 'video') {
    thumb = `<div class="thumb"><video src="${a.src}" muted preload="metadata"></video><span class="hletter">${b.asset}</span></div>`;
  } else {
    thumb = `<div class="thumb"><img src="${a.src}" loading="lazy" alt="${a.name}"><span class="hletter">${b.asset}</span></div>`;
  }
  return `
    <div class="beat">
      <div class="beat-head">
        <span class="bid">${b.id}</span>
        <span class="btime">${b.time}</span>
        <span class="bdur">${b.frames}f</span>
      </div>
      <div class="beat-body">
        ${thumb}
        <div class="beat-content">
          <div class="purpose">${b.purpose}</div>
          <div class="pair"><span class="k">Asset</span><span class="v">${a.name}</span></div>
          <div class="pair"><span class="k">Crop</span><span class="v">${b.crop}</span></div>
          <div class="pair"><span class="k">FX</span><span class="v">${b.fx}</span></div>
          <div class="pair"><span class="k">Trans</span><span class="v">${b.transitions}</span></div>
          <div class="rationale">${b.rationale}</div>
        </div>
      </div>
    </div>`;
}

function renderTimeline() {
  const root = document.getElementById('timeline-container');
  const TOTAL = 60;
  const ticks = [];
  for (let s = 0; s <= 60; s += 5) ticks.push(`<div class="time-tick">${s}s</div>`);
  root.innerHTML = `
    <div class="time-axis">${ticks.join('')}</div>
    ${['A','B','C'].map(L => {
      const sb = STORYBOARDS[L];
      const blocks = sb.beats.map(b => {
        const left = (b.start / TOTAL * 100).toFixed(2);
        const width = ((b.end - b.start) / TOTAL * 100).toFixed(2);
        return `<div class="block" style="left:${left}%;width:${width}%" title="${b.id} · ${b.purpose}">${b.id} · ${b.purpose.slice(0, 32)}</div>`;
      }).join('');
      return `
        <div class="track-row">
          <div class="track-label"><span class="lbox" style="${letterStyle(L)}">${L}</span>${sb.name}</div>
          <div class="track" data-letter="${L}">${blocks}</div>
        </div>`;
    }).join('')}
  `;
}

function renderRefs() {
  document.getElementById('principles').innerHTML = PRINCIPLES.map(p => `
    <div class="principle">
      <div class="stat">${p.stat}</div>
      <div class="title">${p.title}</div>
      <div class="body">${p.body}</div>
      <div class="src">${p.src}</div>
    </div>
  `).join('');
  document.getElementById('refs-grid').innerHTML = REFS.map(r => `
    <div class="ref">
      <h3>${r.name}</h3>
      <div class="src">${r.src}</div>
      <div class="pattern">${r.pattern}</div>
      <p>${r.body}</p>
      <div class="lesson">${r.lesson}</div>
    </div>
  `).join('');
  document.getElementById('anti-grid').innerHTML = ANTI.map(r => `
    <div class="ref">
      <h3>${r.name}</h3>
      <div class="src">${r.src}</div>
      <div class="pattern">${r.pattern}</div>
      <p>${r.body}</p>
      <div class="lesson">${r.lesson}</div>
    </div>
  `).join('');
}

// tabs
document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('section.tab').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

renderBoards();
renderTimeline();

</script>
